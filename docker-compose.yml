services:
  # ----------------------------------------------------
  # 1. Database MongoDB (Otomatis & Persisten)
  # ----------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: jmt_mongodb
    restart: always
    network_mode: host
    environment:
      MONGO_INITDB_DATABASE: fun_football_db
    volumes:
      - jmt_mongo_data:/data/db

  # ----------------------------------------------------
  # 2. JMT Sport Fullstack App (Go API + WebSocket + Nuxt PWA)
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmt_sport_app
    restart: always
    network_mode: host
    environment:
      PORT: "7777"
      MONGO_URI: ${MONGO_URI:-mongodb://127.0.0.1:27017}
      DB_NAME: ${DB_NAME:-fun_football_db}
      GIN_MODE: "release"
    volumes:
      - ./uploads:/app/uploads

volumes:
  jmt_mongo_data:
    name: jmt_mongo_data
