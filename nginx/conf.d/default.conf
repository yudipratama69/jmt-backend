# Upstream ke Container Docker JMT Sport (Port 7777)
upstream jmt_sport_backend {
    server 127.0.0.1:7777;
    keepalive 32;
}

# Konfigurasi Server HTTP (Redirect ke HTTPS atau melayani langsung sebelum SSL)
server {
    listen 80;
    listen [::]:80;
    server_name jmt-sport.jasamedikatransmedic.com;

    # Batas ukuran upload file (Bukti Pembayaran / Foto Profil hingga 25MB)
    client_max_body_size 25M;

    # Logging
    access_log /var/log/nginx/jmt_sport_access.log;
    error_log /var/log/nginx/jmt_sport_error.log warn;

    # Gzip Compression untuk Performa PWA Cepat
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Routing Utama & Reverse Proxy ke Docker
    location / {
        proxy_pass http://jmt_sport_backend;
        proxy_http_version 1.1;

        # Header WebSocket (PENTING untuk Realtime Broadcast & Notifikasi)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Header Standar Proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout settings untuk WebSocket yang stabil
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer settings
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Optimasi Cache untuk Aset Statis PWA (Icons, CSS, JS)
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|css|js|webmanifest)$ {
        proxy_pass http://jmt_sport_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
